<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Concept: poste de pilotage. Barre latérale de navigation + grand espace de travail ;
   chaque fiche (candidature, projet) s'ouvre dans un tiroir à droite. Gris froids teintés de vert,
   un seul accent cobalt, les états du dossier portés par de petites pastilles. */
:root{
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --bg:#EBEFEC; --surface:#FFFFFF; --surface-2:#F4F7F5; --ink:#13201C; --ink-2:#465650; --ink-3:#6C7B75;
  --line:#D5DCD7; --line-2:#E4E9E5; --accent:#2447C6; --accent-ink:#FFFFFF;
  --ok:#1D7A4E; --warn:#B85A0B; --bad:#B3342E; --scrim:rgba(12,20,17,.46);
  --st-todo:#66766F; --st-sent:#2447C6; --st-contact:#0C7686; --st-interview:#7646BE;
  --st-offer:#A8700A; --st-accepted:#1D7A4E; --st-rejected:#B3342E; --st-withdrawn:#8A918E;
  --shadow:0 1px 2px rgba(19,32,28,.06),0 4px 14px rgba(19,32,28,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1311; --surface:#141C19; --surface-2:#101714; --ink:#E5ECE8; --ink-2:#AEBBB5; --ink-3:#86958F;
    --line:#27322E; --line-2:#1E2825; --accent:#7C98FF; --accent-ink:#0A1230;
    --ok:#4FC38A; --warn:#F0963F; --bad:#F27A72; --scrim:rgba(0,0,0,.6);
    --st-todo:#9AA9A3; --st-sent:#7C98FF; --st-contact:#4CC3D3; --st-interview:#B393F0;
    --st-offer:#E4B04D; --st-accepted:#4FC38A; --st-rejected:#F27A72; --st-withdrawn:#8C9591;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1311; --surface:#141C19; --surface-2:#101714; --ink:#E5ECE8; --ink-2:#AEBBB5; --ink-3:#86958F;
  --line:#27322E; --line-2:#1E2825; --accent:#7C98FF; --accent-ink:#0A1230;
  --ok:#4FC38A; --warn:#F0963F; --bad:#F27A72; --scrim:rgba(0,0,0,.6);
  --st-todo:#9AA9A3; --st-sent:#7C98FF; --st-contact:#4CC3D3; --st-interview:#B393F0;
  --st-offer:#E4B04D; --st-accepted:#4FC38A; --st-rejected:#F27A72; --st-withdrawn:#8C9591;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[data-st]{--c:var(--st-todo)}
[data-st="sent"]{--c:var(--st-sent)} [data-st="contact"]{--c:var(--st-contact)} [data-st="interview"]{--c:var(--st-interview)}
[data-st="offer"]{--c:var(--st-offer)} [data-st="accepted"]{--c:var(--st-accepted)} [data-st="rejected"]{--c:var(--st-rejected)}
[data-st="withdrawn"]{--c:var(--st-withdrawn)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.ic{display:inline-flex;vertical-align:-3px;flex:none}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100vh;overflow:auto;padding:20px 14px;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.brand b{display:block;font:700 18px/1.1 var(--font-display);letter-spacing:-.01em}
.brand small{color:var(--ink-3);font-size:12px}
#nav{display:flex;flex-direction:column;gap:2px}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;color:var(--ink-2);text-align:left}
.nav-i:hover{background:var(--surface-2);color:var(--ink)}
.nav-i[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.nav-i .n{margin-left:auto;font:500 12px var(--font-mono);color:var(--ink-3)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--ink-3)}
.main{padding:28px clamp(16px,3vw,40px) 64px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h1{margin:0;font:700 30px/1.1 var(--font-display);letter-spacing:-.02em;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--ink-2)}
.head .acts{display:flex;gap:8px;flex-wrap:wrap}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input,.select,.textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.input::placeholder,.textarea::placeholder{color:var(--ink-3)}
.textarea{min-height:88px;resize:vertical;line-height:1.5}
.select{appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.input:disabled,.select:disabled,.textarea:disabled{background:var(--surface-2);color:var(--ink-2)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .grow{flex:1 1 220px;min-width:180px;position:relative}
.toolbar .grow .input{padding-left:32px}
.toolbar .grow .ic{position:absolute;left:10px;top:9px;color:var(--ink-3)}
.toolbar .select{width:auto;min-width:130px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 10px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.toggle{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-2)}
.toggle[aria-pressed="true"]{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface))}

/* pills, bars */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;color:color-mix(in srgb,var(--c) 78%,var(--ink));background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 32%,var(--surface))}
.pill.flag{--c:var(--warn)}
.pill.ok{--c:var(--ok)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.prio{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.prio i{width:3px;border-radius:1px;background:var(--line)}
.prio i:nth-child(1){height:5px}.prio i:nth-child(2){height:8px}.prio i:nth-child(3){height:12px}
.prio[data-p="high"] i,.prio[data-p="mid"] i:nth-child(-n+2),.prio[data-p="low"] i:nth-child(1){background:var(--ink)}
.eyebrow{font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font:500 12px var(--font-mono);color:var(--ink-2)}
.chip.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--surface))}
.chip.gap{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--surface))}
button.chip{cursor:pointer}
.meter{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.meter>span{display:block;height:100%;background:var(--ok)}

/* generic blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h2{margin:0 0 12px;font:650 16px/1.2 var(--font-display);letter-spacing:-.005em;display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel h2 a,.panel h2 button.link{font:500 13px var(--font-body)}
button.link{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline;text-underline-offset:2px}
.grid-2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.empty{padding:28px 20px;border:1.5px dashed var(--line);border-radius:12px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{font:650 17px var(--font-display);color:var(--ink)}
.empty p{margin:0;max-width:46ch}
.empty.sm{padding:16px 14px;font-size:13px}
.banner{padding:10px 14px;margin-bottom:16px;border-radius:10px;border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--surface));color:var(--ink)}

/* overview */
.cap{display:flex;gap:28px;flex-wrap:wrap;padding:14px 18px;margin-bottom:16px;background:var(--ink);color:var(--bg);border-radius:12px}
.cap>div{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cap .eyebrow{color:color-mix(in srgb,var(--bg) 65%,var(--ink))}
.cap b{font:650 17px var(--font-display)}
.cap .mono{padding:1px 8px;border-radius:6px;background:color-mix(in srgb,var(--bg) 16%,var(--ink));font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.kpi{padding:14px 18px;border-left:1px solid var(--line-2)}
.kpi:first-child{border-left:0}
.kpi b{display:block;font:700 30px/1.1 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--ink-3);font-size:12.5px}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.todo li button{display:flex;gap:12px;align-items:center;width:100%;padding:10px 4px;border:0;border-top:1px solid var(--line-2);background:none;text-align:left}
.todo li:first-child button{border-top:0}
.todo li button:hover{background:var(--surface-2)}
.todo .when{flex:none;width:76px;font:500 12px var(--font-mono);color:var(--ink-3)}
.todo .when.late{color:var(--warn)}
.todo .what{min-width:0;flex:1}
.todo .what b{display:block;font-weight:600}
.todo .what small{color:var(--ink-3)}
.bar{display:flex;height:30px;border-radius:8px;overflow:hidden;gap:2px;background:var(--surface-2)}
.bar span{display:grid;place-items:center;min-width:26px;background:color-mix(in srgb,var(--c) 22%,var(--surface));color:color-mix(in srgb,var(--c) 80%,var(--ink));font:600 12px var(--font-mono)}
.bar.empty-bar{border:1px dashed var(--line);background:none}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin:12px 0 0;padding:0;list-style:none;font-size:13px}
.legend li{display:flex;align-items:center;gap:7px}
.legend .n{margin-left:auto;font:500 12px var(--font-mono);color:var(--ink-3)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:10px;align-items:flex-start}
.steps .box{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--accent-ink)}
.steps li.done .box{background:var(--ok);border-color:var(--ok)}
.steps li.done span.t{color:var(--ink-3);text-decoration:line-through}
.skill-line{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:5px 10px;padding:7px 0}
.skill-line .meter{height:6px;grid-column:1/-1;grid-row:2}
.skill-line .mono{overflow-wrap:anywhere}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line-2);font-size:13px}
.feed li:first-child{border-top:0}
.feed .d{flex:none;width:76px;font:500 12px var(--font-mono);color:var(--ink-3)}
.feed button{border:0;background:none;padding:0;font-weight:600;text-align:left}
.feed button:hover{text-decoration:underline}

/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:1 0 230px;max-width:320px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 4px 4px;font-weight:600}
.col-h .n{margin-left:auto;font:500 12px var(--font-mono);color:var(--ink-3)}
.col-empty{padding:14px 6px;text-align:center;color:var(--ink-3);font-size:12.5px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.acard:hover{box-shadow:var(--shadow);border-color:var(--ink-3)}
.acard.drag{opacity:.45}
.ac-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ac-co{font-weight:650;overflow-wrap:anywhere}
.ac-title{color:var(--ink-2);font-size:13px;overflow-wrap:anywhere}
.ac-meta{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--ink-3);font-size:12px}
.ac-badges{display:flex;flex-wrap:wrap;gap:5px}
.ac-cov{display:flex;align-items:center;gap:8px;font:500 11.5px var(--font-mono);color:var(--ink-3)}
.ac-cov .meter{flex:1}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table.tbl{width:100%;border-collapse:collapse;min-width:760px}
.tbl th{position:sticky;top:0;text-align:left;font:500 11px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px solid var(--line-2);vertical-align:top}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl td b{font-weight:650}
.tbl td small{display:block;color:var(--ink-3)}
.tbl .select{padding:3px 24px 3px 8px;font-size:12.5px;border-radius:999px;font-weight:600;color:color-mix(in srgb,var(--c) 78%,var(--ink));background-color:color-mix(in srgb,var(--c) 14%,var(--surface));border-color:color-mix(in srgb,var(--c) 32%,var(--surface))}
.tbl td.c{text-align:center}
.tbl .yes{color:var(--ok);font-weight:600}
.tbl .no{color:var(--line)}

/* projects & skills */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pcard{display:flex;flex-direction:column;gap:9px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;text-align:left}
.pcard:hover{box-shadow:var(--shadow);border-color:var(--ink-3)}
.pcard h3{margin:0;font:650 17px/1.2 var(--font-display)}
.pcard p{margin:0;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pcard .foot{margin-top:auto;color:var(--ink-3);font-size:12.5px;display:flex;justify-content:space-between;gap:8px}
.sk-row{display:grid;grid-template-columns:minmax(150px,1.1fr) 150px minmax(180px,1.4fr) minmax(160px,1.2fr);gap:14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line-2)}
.sk-row:first-child{border-top:0}
.sk-row.hd{font:500 11px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);border-bottom:1px solid var(--line)}
.sk-dem{display:flex;align-items:center;gap:8px}
.sk-dem .meter{flex:1;height:6px}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(700px,100%);background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.18)}
.dhead{padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.dhead .row1{display:flex;gap:10px;align-items:center}
.title-in{flex:1;min-width:0;border:0;border-bottom:1.5px solid transparent;background:none;padding:2px 0;font:700 24px/1.2 var(--font-display);letter-spacing:-.015em;color:var(--ink)}
.title-in:hover,.title-in:focus{border-bottom-color:var(--line);outline:0}
.title-in::placeholder{color:var(--ink-3)}
.dhead .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dhead .row2 .select{width:auto}
.save{margin-left:auto;font:500 12px var(--font-mono);color:var(--ink-3)}
.save.err{color:var(--bad)}
.jump{display:flex;gap:6px;overflow-x:auto;padding:10px 18px;border-bottom:1px solid var(--line-2);scrollbar-width:thin}
.jump button{border:0;background:none;padding:3px 9px;border-radius:999px;color:var(--ink-2);white-space:nowrap}
.jump button:hover{background:var(--surface-2);color:var(--ink)}
.dbody{flex:1;overflow-y:auto;padding:6px 18px 24px}
.dfoot{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
.sec{padding:18px 0 4px;border-bottom:1px solid var(--line-2);scroll-margin-top:8px}
.sec:last-child{border-bottom:0}
.sec>header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec h3{margin:0;font:650 16px var(--font-display)}
.sec>header small{color:var(--ink-3)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.field small{color:var(--ink-3);font-size:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:42px;align-items:center}
.tags:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.tags .chip button{border:0;background:none;padding:0;color:inherit;line-height:1;display:inline-flex}
.tag-in{flex:1;min-width:140px;border:0;background:none;padding:3px 4px;outline:0}
.rowc{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.rl{display:grid;gap:8px;align-items:center}
.rl.a{grid-template-columns:170px minmax(0,1fr) 36px}
.rl.b{grid-template-columns:150px minmax(0,1fr) minmax(0,1fr)}
.rl.c{grid-template-columns:repeat(3,minmax(0,1fr))}
.rl.d{grid-template-columns:150px minmax(0,1fr)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.addbar{display:grid;grid-template-columns:150px 150px minmax(0,1fr) auto;gap:8px;margin-bottom:12px}
.evl{list-style:none;margin:0;padding:0}
.evl li{display:grid;grid-template-columns:128px 118px minmax(0,1fr) 36px;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line-2)}
.evl li:first-child{border-top:0}
.xbtn{border:0;background:none;color:var(--ink-3);width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.xbtn:hover{background:var(--surface);color:var(--bad)}
.ppick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ppick button{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.ppick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hint{color:var(--ink-3);font-size:13px;margin:0 0 10px}
.modal{position:fixed;z-index:51;left:50%;top:max(8vh,24px);transform:translateX(-50%);width:min(480px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font:700 20px var(--font-display)}
.modal .fgrid{margin:0}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.scrim.top{z-index:50}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.chip.key{font-weight:600;border-width:1.5px}
.chip.dom{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.tags .chip button.star{color:var(--ink-3)}
.tags .chip.key button.star{color:var(--warn)}
.chip .ic{color:var(--warn)}
.sec.brief{background:var(--surface-2);margin:12px -18px 0;padding:18px;border-bottom:1px solid var(--line)}
.bf-head{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.bf-head .t{font:650 18px/1.3 var(--font-display)}
.bf-head .s{color:var(--ink-2)}
.bf-need{margin:0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:15px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.bf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 22px;margin-top:18px}
.bf-b{display:flex;flex-direction:column;gap:6px;min-width:0}
.bf-b.wide{grid-column:1/-1}
.bf-b p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.bf-empty{align-self:flex-start;border:1px dashed var(--line);background:none;color:var(--ink-3);padding:3px 10px;border-radius:8px;font-size:13px}
.bf-empty:hover{border-color:var(--accent);color:var(--accent)}
.kvs{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 14px;margin:0}
.kvs dt{color:var(--ink-3)}
.kvs dd{margin:0;overflow-wrap:anywhere}
.bf-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.bf-cov{display:flex;align-items:center;gap:10px;font:500 12px var(--font-mono);color:var(--ink-3)}
.bf-cov .meter{flex:1;max-width:160px}
.chips.big .chip{font-size:13px;padding:3px 10px}
.ac-tags{display:flex;flex-wrap:wrap;gap:4px}
.ac-tags .chip{font-size:11px;padding:1px 6px}
.lock{max-width:520px;margin:12vh auto 0}
.banner.info{border-color:var(--line);background:var(--surface)}
.lockform{display:grid;gap:10px;max-width:420px}

}

  .legend{grid-template-columns:minmax(0,1fr)}
  .drawer{border-left:0}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

<script>
(function(){

/* ---------- constants ---------- */

const CTX_L=Object.fromEntries(CTX);
const PSTAT=[['done','Terminé'],['wip','En cours'],['archived','Archivé']];
const PSTAT_L=Object.fromEntries(PSTAT);
const DOMAINS=['SOC / détection','Pentest / Red team','Audit / Conformité (GRC)','Réponse à incident / DFIR','Forensique / Reverse','Cloud security','Sécurité applicative / DevSecOps','Cryptographie','Threat intelligence','Sécurité des réseaux','Systèmes embarqués / IoT','IAM / Identités','Data engineering','Data science / ML','Gouvernance des données','IA et sécurité','Big Data'];
const SENSITIVE=[[/\b[12]\s?\d{2}\s?(0[1-9]|1[0-2])\s?\d{2}\s?\d{3}\s?\d{3}\s?\d{2}\b/,'un numéro de sécurité sociale'],[/\b[A-Z]{2}\d{2}(?:\s?[A-Z0-9]{4}){3,7}\b/,'un IBAN'],[/\b(?:\d[ -]?){13,19}\b/,'un numéro de carte bancaire'],[/\b(mot de passe|password|mdp)\s*[:=]\s*\S+/i,'un mot de passe']];

/* ---------- helpers ---------- */

}
const $=(s,r)=>(r||document).querySelector(s);
const IC={
  plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>', search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"/>', link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  download:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>', check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>', clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  grid:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="4" rx="1.5"/><rect x="13" y="10" width="7" height="10" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/>',
  brief:'<rect x="3.5" y="7" width="17" height="12" rx="2"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3.5 12.5h17"/>',
  file:'<path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5zM14 3.5V8h4"/>',
  code:'<path d="M9 8l-4 4 4 4M15 8l4 4-4 4M13.5 5.5l-3 13"/>', target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>',
  board:'<rect x="4" y="4" width="4.5" height="16" rx="1"/><rect x="10" y="4" width="4.5" height="10" rx="1"/><rect x="16" y="4" width="4" height="13" rx="1"/>',
  list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>', ext:'<path d="M14 5h5v5M19 5l-8 8M11 6H6a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-5"/>',
  star:'<path d="M12 3.6l2.6 5.4 5.9.8-4.3 4.1 1.1 5.8L12 17l-5.3 2.7 1.1-5.8L3.5 9.8l5.9-.8z"/>', lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  cog:'<circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4L18 18M6 18l1.6-1.6M16.4 7.6L18 6"/>',
  upload:'<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>'
};
const icon=(n,s,f)=>h('span',{class:'ic',html:'<svg width="'+(s||16)+'" height="'+(s||16)+'" viewBox="0 0 24 24" fill="'+(f?'currentColor':'none')+'" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]||1)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const FMT=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short',year:'numeric'});
const FMT_S=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short'});
const FMT_M=new Intl.DateTimeFormat('fr-FR',{month:'short',year:'numeric'});
const VALID_D=/^\d{4}-\d{2}(-\d{2})?$/;
const vd=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)?x:'';
const fmtWith=F=>x=>{if(!x||!VALID_D.test(x))return '';const d=parse(x);return isNaN(d)?'':F.format(d)};
const fmtDate=fmtWith(FMT),fmtShort=fmtWith(FMT_S),fmtMonth=fmtWith(FMT_M);
const rel=s=>{if(!VALID_D.test(s||''))return '';const n=diffDays(s,today());return n===0?"aujourd'hui":n===1?'demain':n===-1?'hier':n>0?'dans '+n+' j':'il y a '+(-n)+' j'};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
const href=u=>{u=(u||'').trim();if(!u)return '';if(/^https?:\/\//i.test(u))return u;if(/^[\w-]+(\.[\w-]+)+(\/|$)/.test(u))return 'https://'+u;return ''};

/* ---------- state ---------- */
const S={apps:new Map(),projects:new Map(),view:'overview',layout:innerWidth<900?'list':'board',
  q:'',fStatus:'',fPrio:'',fDue:false,sort:'activity',showClosed:false,pq:'',
  store:null,dl:null,canWrite:true,loaded:{apps:false,projects:false,settings:false},prefs:{targetStart:'',eventLabel:'',eventDate:''},error:'',note:'',rev:0,locked:false};
let D=null;      // open drawer
let raf=0;

/* ---------- models ---------- */
function newApp(p){const n=new Date().toISOString();return Object.assign({id:uid(),company:'',sector:'',location:'',website:'',channel:'',priority:'mid',status:'todo',
  title:'',offerUrl:'',offerRef:'',durationMonths:4,startDate:'',workMode:'',pay:'',missions:'',profile:'',constraints:'',skills:[],keySkills:[],softSkills:[],domains:[],realNeed:'',whyMe:'',team:'',process:'',
  provided:[],contacts:[],events:[],projectIds:[],projectNote:'',nextAction:'',nextDate:'',deadline:'',appliedAt:'',notes:'',createdAt:n,updatedAt:n},p||{})}
function newProject(p){const n=new Date().toISOString();return Object.assign({id:uid(),name:'',status:'done',context:'school',startMonth:'',endMonth:'',role:'',teamSize:'',
  summary:'',description:'',contributions:'',results:'',technologies:[],skills:[],domains:[],links:[],learnings:'',pitch:'',createdAt:n,updatedAt:n},p||{})}
const STR_APP=['company','sector','location','website','channel','priority','status','title','offerUrl','offerRef','startDate','workMode','missions','profile','constraints','realNeed','whyMe','team','process','projectNote','nextAction','nextDate','deadline','appliedAt','notes','createdAt','updatedAt'];
const STR_PROJ=['name','status','context','startMonth','endMonth','role','summary','description','contributions','results','learnings','pitch','createdAt','updatedAt'];
const toStr=(o,keys)=>{for(const k of keys)if(typeof o[k]!=='string')o[k]=o[k]==null?'':String(o[k])};
function fix(kind,d){
  const o=Object.assign(kind==='apps'?newApp():newProject(),d);
  toStr(o,kind==='apps'?STR_APP:STR_PROJ);
  const strs=k=>{o[k]=(Array.isArray(o[k])?o[k]:[]).filter(x=>x!=null&&typeof x!=='object').map(String)};
  const objs=(k,keys)=>{o[k]=(Array.isArray(o[k])?o[k]:[]).filter(x=>x&&typeof x==='object').map(x=>{const y=Object.assign({},x);toStr(y,keys);if(!y.id)y.id=uid();return y})};
  if(kind==='apps'){
    ['skills','keySkills','softSkills','domains','projectIds'].forEach(strs);
    objs('provided',['kind','label','url','date','note']);objs('contacts',['name','role','email','phone','linkedin','note']);objs('events',['date','type','text']);
    if(!STAT_L[o.status])o.status='todo';if(!PRIO_L[o.priority])o.priority='mid';
    o.provided.forEach(p=>{if(!DOCK_L[p.kind])p.kind='other'});o.events.forEach(e=>{if(!EV_L[e.type])e.type='note'});
  }else{
    ['technologies','skills','domains'].forEach(strs);objs('links',['label','url']);
    if(!PSTAT_L[o.status])o.status='done';if(!CTX_L[o.context])o.context='other';
  }
  return o;
}

/* ---------- derived ---------- */
const wasSent=a=>a.status!=='todo'&&!(a.status==='withdrawn'&&!a.appliedAt);
const gotReply=a=>['contact','interview','offer','accepted','rejected'].includes(a.status)||a.events.some(e=>e.type==='reply');
const hadInterview=a=>['interview','offer','accepted'].includes(a.status)||a.events.some(e=>e.type==='interview');
function lastActivity(a){const ds=[a.appliedAt].concat(a.events.map(e=>e.date)).filter(Boolean).sort();return ds.length?ds[ds.length-1]:(a.createdAt||'').slice(0,10)}
function followUp(a){
  if(a.status!=='sent'&&a.status!=='contact') return null;
  if(a.nextDate) return {due:a.nextDate<=today(),date:a.nextDate};
  const l=lastActivity(a); if(!l) return null;
  const d=addDays(l,FOLLOWUP_DAYS); return {due:d<=today(),date:d,auto:true};

let idxRev=-1,idxCache=null;
function ownIndex(){
  if(idxRev===S.rev&&idxCache) return idxCache;

}
const isKey=(a,s)=>a.keySkills.some(k=>norm(k)===norm(s));

  const out=[...m.values()];out.forEach(e=>e.projects=idx.get(e.key)||[]);
  return out.sort((x,y)=>y.apps.length-x.apps.length||x.label.localeCompare(y.label,'fr'));
}
function allSkillLabels(){const s=new Set();for(const a of S.apps.values())a.skills.forEach(x=>s.add(x));for(const p of S.projects.values())p.technologies.concat(p.skills).forEach(x=>s.add(x));return [...s].sort((a,b)=>a.localeCompare(b,'fr'))}

/* ---------- storage ---------- */
function dbStore(db){return {mode:'db',

    if(vault){const v=vault;chain=chain.then(async()=>{try{localStorage.setItem(VKEY,await encJson(v.key,v.salt,mem))}catch(e){fail()}})}

    password:()=>vault?vault.pw:'',

async function openBackup(text){

  if(o&&o.iv&&o.data&&o.salt){
    let pw=S.store&&S.store.password?S.store.password():'',tries=0;
    for(;;){

}

/* ---------- export ---------- */
function blobSave(name,data){const type=/\.csv$/.test(name)?'text/csv;charset=utf-8':'application/json';const u=URL.createObjectURL(new Blob([data],{type}));
  const a=h('a',{href:u,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('Fichier enregistré.')}
async function saveFile(name,data){
  if(!S.dl){blobSave(name,data);return}
  try{await S.dl.save({filename:name,data});toast('Fichier enregistré.')}catch(e){if(!e||e.code!=='declined')toast('Export impossible dans cette vue.')}}
function exportJson(){saveFile(FILEP+'-sauvegarde-'+today()+'.json',JSON.stringify({app:'cap-stage',version:1,exportedAt:new Date().toISOString(),apps:[...S.apps.values()],projects:[...S.projects.values()],prefs:S.prefs},null,2))}
function exportCsv(){saveFile(FILEP+'-candidatures-'+today()+'.csv',csvText())}
function csvText(){
  const c=v=>{v=v==null?'':String(v);return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const cols=['Entreprise','Statut','Priorité','Stage','Lien de l’offre','Lieu','Durée (mois)','Début souhaité','Gratification (€/mois)','Canal','Envoyée le','Date limite','Prochaine étape','Pour le','Compétences demandées','Données fournies','Projets présentés','Contacts','Notes','Domaines','Compétences clés','Ce qu’ils cherchent vraiment'];
  const rows=[...S.apps.values()].sort((a,b)=>a.company.localeCompare(b.company,'fr')).map(a=>[a.company,STAT_L[a.status],PRIO_L[a.priority],a.title,a.offerUrl,a.location,a.durationMonths,a.startDate,a.pay,a.channel,a.appliedAt,a.deadline,a.nextAction,a.nextDate,
    a.skills.join(', '),a.provided.map(p=>(DOCK_L[p.kind]||'Autre')+(p.label?' ('+p.label+')':'')+(p.date?' '+p.date:'')).join(' | '),
    a.projectIds.map(id=>(S.projects.get(id)||{}).name).filter(Boolean).join(', '),a.contacts.map(x=>[x.name,x.role,x.email].filter(Boolean).join(' - ')).join(' | '),a.notes,a.domains.join(', '),a.keySkills.join(', '),a.realNeed]);
  return '\ufeff'+[cols].concat(rows).map(r=>r.map(c).join(';')).join('\r\n');
}

/* ---------- boot ---------- */
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  const m=$('#layer .modal');if(m){m.parentNode.querySelectorAll('.modal,.scrim.top').forEach(n=>n.remove());return}
  if(D)closeDrawer();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
window.addEventListener('pagehide',()=>flush());
let lastWarn=0;
document.addEventListener('input',e=>{
  const t=e.target;if(!t||!t.closest||!t.closest('.drawer'))return;
  const v=t.value||'';if(v.length<9)return;
  for(const r of SENSITIVE){if(r[0].test(v)){if(Date.now()-lastWarn>15000){lastWarn=Date.now();toast('Attention : cette saisie ressemble à '+r[1]+'. Évitez de la stocker ici.')}break}}
});
$('#quick-app').addEventListener('click',()=>quickAdd('apps'));

async function init(){
  const v=(location.hash||'').slice(1);if(NAV.some(n=>n[0]===v))S.view=v;
  if(STANDALONE){
    const b=$('.brand b'),sm=$('.brand small');if(b)b.textContent='Cap Stage';if(sm)sm.textContent='Candidatures de stage';
    let vaulted=false,blocked=false;
    try{vaulted=!!localStorage.getItem(VKEY)}catch(e){blocked=true}
    try{localStorage.setItem('capavril:t','1');localStorage.removeItem('capavril:t')}catch(e){blocked=true}
    if(blocked)S.note='Le stockage du navigateur est bloqué (navigation privée ?) : vos données seront perdues à la fermeture de la page. Exportez régulièrement une sauvegarde.';
    if(vaulted){S.locked='vault';document.body.classList.add('ro');renderNav();renderMain();return}
  }
  renderNav();renderMain();
  const api=window.claude;let db=null,user=null;
  if(api&&api.use){
    try{db=await api.use('db')}catch(e){}
    try{user=await api.use('user')}catch(e){}
    try{S.dl=await api.use('downloads')}catch(e){}
  }
  if(user){
    try{if((await user.isOwner())===false){S.locked=true;document.body.classList.add('ro')}}catch(e){}
    if(!S.locked){try{if((await user.can('data.write'))===false){S.canWrite=false;document.body.classList.add('ro')}}catch(e){}}
  }
  if(S.locked){renderNav();renderMain();return}
  if(db){S.store=dbStore(db)}
  else{S.store=localStore();if(api)S.note='La base de données n’est pas disponible dans cette vue : les données sont gardées localement dans ce navigateur.'}
  renderSideFoot();attach();
}
init();
})();
